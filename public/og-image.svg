  <circle cx="260" cy="190" r="5" fill="#34d399"/>
  <text x="275" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" letter-spacing="1">100% FREE • NO LOGIN</text>

